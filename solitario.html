<!DOCTYPE html>

<html>

<head>
	<title>Solitario VIU</title>
	<meta charset="utf-8">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
	<!--/*** !!!!!!!!!!!!!!!!!!! CODIGO !!!!!!!!!!!!!!!!!!!! **/
		Invocar a los ficheros de estilos y al JavaScript donde proceda
        -->
	<link rel="stylesheet" type="text/css" href="css/solitario.css">
</head>

<body>
	<div class="central">
		<!-- Título principal -->

		<!--/*** !!!!!!!!!!!!!!!!!!! CODIGO !!!!!!!!!!!!!!!!!!!! **/
			Rellenar h1 e insertar el logo donde proceda
        	-->
		<header class="container">
					<h1 id="title">Juego del solitario<img id="logo" src="imagenes/logoVIU.png" alt="Logo del Solitario VIU"></h1>
		</header>


		<!-- Siguiente línea donde se indicará el tiempo transcurrido y la cantidad
				de movimientos que se han hecho hasta el momento. Estos números se 
				indicarán en los span internos -->
		<h2 id="tags">
			<span>Tiempo: <span id="timer_counter"></span></span>
			<span style="display:inline-block; width:200px"></span>
			<span>Movimientos: <span id="movement_counter" class=""></span></span>
		</h2>

		<!-- La "mesa" contendrá los 6 tapetes. En la parte superior dos de ellos 
				y en la parte inferior los cuatro restantes. Los contadores de los
				mazos de cartas de cada tapete están indicados oportunamente dentro
				de elementos span -->
		<div id="table">
			<div class="superior_mat">
				<div id="initial" class="mat"><span id="init_counter" class="counter"></span></div><!--
					-->
				<div id="leftover" class="mat"><span id="leftover_counter" class="counter"></span></div>
			</div>
			<div id="receptor1" class="mat receptor"><span id="receptor_counter1" class="counter"></span></div><!--
				-->
			<div id="receptor2" class="mat receptor"><span id="receptor_counter2" class="counter"></span></div><!--
				-->
			<div id="receptor3" class="mat receptor"><span id="receptor_counter3" class="counter"></span></div><!--
				-->
			<div id="receptor4" class="mat receptor"><span id="receptor_counter4" class="counter"></span></div>
		</div>

		<!-- Botón de reset que reinicia todo: partida, contadores de tiempo, de movimientos, ... -->
		<button id="reset" class="btn btn-danger">Reiniciar</button>
	</div> <!-- class="central" -->
</body>

</html>
